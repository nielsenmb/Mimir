[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimir-astro"
version = "0.1.0"
description = "Time-series preparation and power-density spectra for asteroseismology"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Martin Nielsen" },
]
keywords = [
    "asteroseismology",
    "astronomy",
    "lomb-scargle",
    "power-spectrum",
    "time-series",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=6.0",
    "nifty-ls>=1.1.0",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
mast = [
    "lightkurve>=2.5",
]
test = [
    "build>=1.2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.12",
]
compat = [
    "pbjam==2.0.4",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
]

[project.urls]
Changelog = "https://github.com/nielsenmb/Mimir/blob/main/CHANGELOG.md"
Issues = "https://github.com/nielsenmb/Mimir/issues"
Repository = "https://github.com/nielsenmb/Mimir"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "compatibility: characterises behaviour inherited from pbjam.IO",
]

[tool.coverage.run]
branch = true
source = ["mimir"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "NPY", "UP", "W"]
ignore = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
